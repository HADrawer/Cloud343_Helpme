<div class="chapter-grid">${chapterGuides.map((g,i)=>`<button data-ch="${i+1}" class="chapter-card" style="--accent:${CH[i].color}"><span class="badge">CH 0${i+1}</span><h3>${esc(g[lang()==='ar'?1:0])}</h3><p>${esc(g[lang()==='ar'?3:2])}</p><div class="tiny">${lang()==='ar'?'افتح الدروس ←':'Open lessons →'}</div></button>`).join('')}</div>
${secHead(lang()==='ar'?'احفظ التسع ميزات بهذه الطريقة':'All 9 Systems Manager features')}
<div style="border:1px solid var(--edge);background:#121f32;border-radius:18px;overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:570px;text-align:start"><thead><tr style="background:#203347;color:#a5edda"><th style="padding:12px;text-align:start">Feature</th><th style="padding:12px;text-align:start">${lang()==='ar'?'وظيفتها':'Purpose'}</th><th style="padding:12px;text-align:start">Scenario</th></tr></thead><tbody>${features.map((f,i)=>`<tr style="border-top:1px solid #283c52;background:${i%2?'#18283c':''}"><td style="padding:11px;font-weight:800;color:#a6ffe8" dir="ltr">${f[0]}</td><td style="padding:11px;font-size:12px">${esc(f[lang()==='ar'?2:1])}</td><td style="padding:11px;color:#a7c3d6;font-size:12px">${esc(f[lang()==='ar'?4:3])}</td></tr>`).join('')}</tbody></table></div>
${secHead(lang()==='ar'?'الفرق اللي لازم ما تنساه':'Do not confuse these')}
<div class="chapter-grid">${pairs.map(v=>`<div class="micro"><div class="labeltop" dir="ltr">${v[0]} / ${v[1]}</div><p><b style="color:var(--green)">${v[0]}:</b> ${esc(v[lang()==='ar'?4:2])}</p><p><b style="color:var(--purple)">${v[1]}:</b> ${esc(v[lang()==='ar'?5:3])}</p></div>`).join('')}</div>
${secHead(lang()==='ar'?'أسئلة مقالية: خطوات قصيرة تحفظها':'Short-answer workflows')}
<div class="chapter-grid"><div class="micro green"><div class="labeltop">Automation</div><p>${lang()==='ar'?'اختَر أو أنشئ Automation Document → شغّل الـRunbook → تابع التنفيذ والنتائج.':'Create/choose an Automation document → execute the runbook → monitor results.'}</p></div><div class="micro green"><div class="labeltop">Patch Manager</div><p>${lang()==='ar'?'حدد الأجهزة والـPatch Baseline → حدد Maintenance Window إذا الوقت مهم → ثبّت التحديثات → افحص Compliance.':'Choose targets and patch baseline → schedule maintenance window if needed → patch → verify compliance.'}</p></div><div class="micro green"><div class="labeltop">Run Command</div><p>${lang()==='ar'?'تأكد من SSM Agent والـInstance Role → اختر Document → اختر الأجهزة بـTags → نفذ وراجع المخرجات.':'Ensure Agent/instance role → select command document → target by tags → execute and review output.'}</p></div><div class="micro green"><div class="labeltop">ECS + Fargate</div><p>${lang()==='ar'?'جهّز Container Image → عرّف Task Definition وCPU/Memory وIAM/Network → شغّل Task باستخدام Fargate.':'Build container image → define task, CPU/memory, IAM/network → run the ECS task on Fargate.'}</p></div></div>
<div class="micro pink" style="margin-top:20px"><div class="labeltop">${t('trap')} · ${lang()==='ar'?'الاختبار السابق':'Past exam wording'}</div><p>${lang()==='ar'?'في نموذج Spring 2024/2025 الإجابة المكتوبة لسيناريو «بدون Bastion أو SSH» كانت Run Command، لكن سلايد Chapter 2 رقم 11 يخصص الدخول التفاعلي لـSession Manager. في الاختبار انتبه إذا المطلوب «تشغيل سكربت» أو «الدخول التفاعلي».':'The Spring 2024/2025 example labels a no-SSH scenario as Run Command, while Chapter 2 slide 11 identifies Session Manager for interactive access. Read whether the scenario asks for a script or an interactive shell.'}</p></div>
<div class="btn-row" style="margin-top:21px"><button class="btn primary" data-page="quiz">◉ ${t('practice')}</button><button class="btn" data-page="exam">◷ ${t('exam')}</button></div><p class="source-note">${t('sourceNote')}</p>`;
}
const simScenarios=[
 ['Install updates across 100 Windows servers','تطبيق تحديثات على ١٠٠ سيرفر Windows','Patch Manager'],['Secure interactive shell without SSH','دخول Terminal آمن بدون SSH','Session Manager'],['Run a script on 300 tagged EC2 instances','تشغيل سكربت على ٣٠٠ جهاز حسب Tags','Run Command'],['Create fresh AMI from a runbook nightly','إنشاء AMI كل ليلة بخطوات متعددة','Automation'],['Restrict maintenance to a Sunday window','حصر الصيانة في يوم الأحد','Maintenance Windows'],['Maintain configuration on all instances','الحفاظ على Configuration ثابت','State Manager'],['Store secure application configuration values','تخزين قيم إعدادات التطبيق بشكل آمن','Parameter Store'],['List the software installed across servers','جمع قائمة البرامج المثبتة','Inventory'],['View patch compliance status in one place','عرض حالة الالتزام بالتحديثات بلوحة واحدة','Insights Dashboard']
];
function simView(){const s=simScenarios[state.simIndex%simScenarios.length];return `<span class="eyebrow">INTERACTIVE LAB-FREE / ${t('play')}</span><h1 class="page-title">${t('sim')}</h1><p class="subline">${lang()==='ar'?'تفاعلات بسيطة تخليك تشوف الفكرة بدل ما تحفظها بس. ما تحتاج AWS Account.':'Small interactive visualizations to understand each idea, with no AWS account required.'}</p><div class="sim-grid"><section class="sim-card"><h3>◈ ${t('routing')}</h3><p>${t('routingHint')}</p><div class="btn-row" style="justify-content:space-between"><span>${t('regionA')}</span><b id="weightA" class="sim-result">70%</b></div><input aria-label="Weighted traffic to Region B" id="weightRange" class="range" type="range" min="0" max="100" step="5" value="${state.simWeight}"><div class="btn-row" style="justify-content:space-between"><span>${t('regionB')}</span><b id="weightB" style="color:var(--purple);font-size:20px">30%</b></div><div class="traffic"><div id="trafficA" style="background:#2e8e86;width:70%">A</div><div id="trafficB" style="background:#6b59b7;width:30%">B</div></div><div id="packets" class="packets"></div></section><section class="sim-card"><h3>↗ ${t('scaling')}</h3><p>${t('scalingHint')}</p><div class="btn-row" style="justify-content:space-between"><span>CPU Utilization</span><span id="cpuValue" class="sim-result">55%</span></div><input id="cpuRange" aria-label="CPU percent" class="range" type="range" min="0" max="100" value="${state.simCpu}"><div class="server-rack" id="serverRack"></div><div class="status" id="scalingStatus"></div></section><section class="sim-card wide"><h3>▧ ${t('ssmGame')}</h3><p>${t('ssmGameHint')}</p><div class="situation">${esc(s[lang()==='ar'?1:0])}</div><div class="mini-answers">${['Automation','Run Command','Session Manager','Patch Manager','Maintenance Windows','State Manager','Parameter Store','Inventory','Insights Dashboard'].map(n=>`<button data-ssm="${esc(n)}">${n}</button>`).join('')}</div><div id="ssmStatus" class="${state.simAnswered?'status':''}">${state.simMsg?esc(state.simMsg):''}</div><div class="btn-row" style="margin-top:13px"><button class="btn secondary" data-action="nextSim">↻ ${t('another')}</button></div></section><section class="sim-card wide"><h3>⌘ ${t('policy')}</h3><p>${t('policyHint')}</p><div class="policy-view">{<br>&nbsp;"Effect": <button data-policy="Effect">"Allow"</button>,<br>&nbsp;"Principal": { "AWS": <button data-policy="Principal">"account-id:root"</button> },<br>&nbsp;"Action": <button data-policy="Action">"s3:*"</button>,<br>&nbsp;"Resource": [<br>&nbsp;&nbsp;<button data-policy="Resource">"arn:aws:s3:::mybucket"</button>,<br>&nbsp;&nbsp;<button data-policy="Resource">"arn:aws:s3:::mybucket/*"</button><br>&nbsp;]<br>}</div><div id="policyStatus" class="status" style="margin-top:12px"></div></section></div>`}
function updateSimVisuals(){updateWeight();updateCpu();updatePolicy()}
function updateWeight(){const n=state.simWeight;if(!el('weightA'))return;el('weightA').textContent=(100-n)+'%';el('weightB').textContent=n+'%';el('trafficA').style.width=(100-n)+'%';el('trafficB').style.width=n+'%';el('trafficA').textContent=(100-n>=15?'A '+(100-n)+'%':'');el('trafficB').textContent=(n>=15?'B '+n+'%':'');el('packets').innerHTML=Array.from({length:20},(_,i)=>`<span class="packet ${i<Math.round(n/5)?'secondary':''}" style="animation-delay:${i*20}ms"></span>`).join('')}
function updateCpu(){if(!el('cpuValue'))return;let v=state.simCpu,delta=v>75?3:v>40?1:0,count=3+delta;el('cpuValue').textContent=v+'%';el('serverRack').innerHTML=Array.from({length:count},(_,i)=>`<div class="server" style="animation-delay:${i*60}ms">▣</div>`).join('');el('scalingStatus').textContent=lang()==='ar'?`٣ أجهزة أساسية + ${delta} أجهزة بسبب سياسة Step Scaling = ${count} أجهزة (مثال تعليمي)`: `3 base + ${delta} added by step scaling = ${count} instances (teaching example)`}
const policyDefs={Effect:['Controls Allow vs Deny.','يحدد Allow أو Deny.'],Principal:['Names who receives permissions in a resource-based policy.','يحدد صاحب الصلاحيات داخل Resource-based Policy.'],Action:['s3:* matches S3 actions; other fields still constrain access.','s3:* تعني عمليات S3، وبقية حقول السياسة تحدد النطاق.'],Resource:['Bucket ARN and bucket/* distinguish the bucket from its objects.','ARN للبكت وbucket/* للملفات الموجودة داخله.']};
function updatePolicy(){if(!el('policyStatus'))return;el('policyStatus').textContent=state.policyPart+' → '+policyDefs[state.policyPart][lang()==='ar'?1:0];$$('[data-policy]').forEach(b=>b.classList.toggle('active',b.dataset.policy===state.policyPart))}
function evaluateSSM(n){if(state.simAnswered)return;const correct=simScenarios[state.simIndex%simScenarios.length][2];state.simAnswered=true;state.simMsg=n===correct?(lang()==='ar'?'صح! هذا هو استخدام '+correct:'Correct! That is '+correct):(lang()==='ar'?'مو صحيح. الخدمة المناسبة: '+correct:'Not quite. Use '+correct);if(n===correct){addXP(8)}el('ssmStatus').className=n===correct?'status':'status fail';el('ssmStatus').textContent=state.simMsg}
function nextSim(){state.simIndex=(state.simIndex+1)%simScenarios.length;state.simAnswered=false;state.simMsg='';render()}
// All event bindings are delegated, so dynamic views remain interactive.
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-page],[data-ch],[data-lesson],[data-done],[data-lang],[data-flash],[data-answer],[data-quiz-count],[data-flash-mode],[data-quiz-ch],[data-ssm],[data-policy]');if(!target)return;
if(target.dataset.lang){setLang(target.dataset.lang);return}
if(target.dataset.page){navigate(target.dataset.page);return}
if(target.dataset.ch){selectChapter(Number(target.dataset.ch));return}
if(target.dataset.lesson){openLesson(target.dataset.lesson);return}
if(target.dataset.done){markLesson(target.dataset.done);return}
if(target.dataset.flashMode){state.flashMode=target.dataset.flashMode;setupFlash();render();return}
if(target.dataset.flash){rankFlash(target.dataset.flash==='know');return}
if(target.dataset.answer!==undefined){answerQuiz(Number(target.dataset.answer));return}
if(target.dataset.quizCount){state.quizCount=Number(target.dataset.quizCount);render();return}
if(target.dataset.quizCh){state.page='quiz';clearQuiz();state.quizFilter=target.dataset.quizCh;render();return}
if(target.dataset.ssm){evaluateSSM(target.dataset.ssm);return}
if(target.dataset.policy){state.policyPart=target.dataset.policy;updatePolicy();return}
const act=target.dataset.action;
switch(act){case'menu':toggleSidebar();break;case'flip':flipFlash();break;case'flashShuffle':setupFlash();render();break;case'beginQuiz':beginQuiz();break;case'nextQuiz':nextQuiz();break;case'restartQuiz':clearQuiz();beginQuiz();break;case'nextSim':nextSim();break}
});
document.addEventListener('input',e=>{if(e.target.id==='weightRange'){state.simWeight=Number(e.target.value);updateWeight()}if(e.target.id==='cpuRange'){state.simCpu=Number(e.target.value);updateCpu()}if(e.target.id==='lessonSearch'){state.search=e.target.value;paintLessonList()}});
document.addEventListener('change',e=>{if(e.target.id==='coreOnly'){state.onlyCore=e.target.checked;paintLessonList()}if(e.target.id==='flashCh'){state.flashChapter=Number(e.target.value);setupFlash();render()}if(e.target.id==='quizFilter'){state.quizFilter=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar();if((e.key==='Enter'||e.key===' ')&&document.activeElement?.id==='flashCard'){e.preventDefault();flipFlash()}if(state.quizQueue.length&&!state.quizFinished&&state.quizSelection===null&&['1','2','3','4'].includes(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){answerQuiz(Number(e.key)-1)}});
el('overlay').addEventListener('click',closeSidebar);
// Navigation state is not hidden in a framework, making this file usable offline.
setupFlash();render();
</script>
